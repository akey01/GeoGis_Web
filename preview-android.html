      padding: 0;

    .hidden-view { display: none !important; }
    input, select, textarea { outline: none; }

  <script>
    const CLOUD_URL = 'https://geogis6-android.onrender.com';

    // Desktop frame setup (only outside Capacitor, outside Stitch iframe, and >= 768px)
    const isCapacitorNative = Boolean(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    const inEmbedIframe = window.self !== window.top;
    if (!isCapacitorNative && !inEmbedIframe && window.innerWidth >= 768) {
      document.body.classList.add('desktop-frame-mode');
      const dBar = document.getElementById('desktop-bar');
      dBar.classList.remove('hidden');
      dBar.classList.add('flex');
      document.getElementById('btn-toggle-desktop-frame').addEventListener('click', () => {
        const active = document.body.classList.toggle('desktop-frame-mode');
        document.getElementById('btn-toggle-desktop-frame').textContent = active ? 'Pantalla Completa' : 'Marco Celular';
        setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 250);
      });
    }

    // ======================== GEODETIC ENGINE (HAYFORD / GRS80 / PATVEN-98 / RIGIDA02) ========================
    const HAYFORD = {
      a: 6378388.0, f: 1 / 297.0,
      get b() { return this.a * (1 - this.f); },
      get e2() { return 2 * this.f - this.f * this.f; },
      get ep2() { return this.e2 / (1 - this.e2); },
    };
    const GRS80 = {
      a: 6378137.0, f: 1 / 298.257222101,
      get b() { return this.a * (1 - this.f); },
      get e2() { return 2 * this.f - this.f * this.f; },
      get ep2() { return this.e2 / (1 - this.e2); },
    };
    const PATVEN98 = {
      dx: -270.933, dy: 115.599, dz: -360.226,
      rx: -5.266, ry: -1.238, rz: 2.381, ds: -5.109,
      XM: 2464351.594, YM: -5783466.613, ZM: 974809.808,
    };

    class GeoEngine {
      static RIGIDA02_DELTA_ESTE = -204.330;
      static RIGIDA02_DELTA_NORTE = -311.540;
      static RIGIDA02_COTA_GEOIDAL = -22.450;

      static toRad(deg) { return (deg * Math.PI) / 180; }
      static toDeg(rad) { return (rad * 180) / Math.PI; }
      static _N(latR, el) { const s = Math.sin(latR); return el.a / Math.sqrt(1 - el.e2 * s * s); }

      static detectHuso(lng) {
        if (lng >= -78 && lng < -72) return 18;
        if (lng >= -72 && lng < -66) return 19;
        if (lng >= -66 && lng < -60) return 20;
        if (lng >= -60 && lng < -54) return 21;
        return lng < -66 ? 19 : 20;
      }

      static geoToCart(latDeg, lngDeg, h, el) {
        const lat = this.toRad(latDeg), lng = this.toRad(lngDeg), N = this._N(lat, el);
        return { X: (N + h) * Math.cos(lat) * Math.cos(lng), Y: (N + h) * Math.cos(lat) * Math.sin(lng), Z: (N * (1 - el.e2) + h) * Math.sin(lat) };
      }

      static cartToGeo(X, Y, Z, el) {
        const p = Math.sqrt(X * X + Y * Y);
        let lat = Math.atan2(Z, p * (1 - el.e2));
        for (let i = 0; i < 15; i++) {
          const N = this._N(lat, el);
          const next = Math.atan2(Z + el.e2 * N * Math.sin(lat), p);
          if (Math.abs(next - lat) < 1e-14) break;
          lat = next;
        }
        const lng = Math.atan2(Y, X), N = this._N(lat, el);
        const h = Math.cos(lat) !== 0 ? p / Math.cos(lat) - N : Z / Math.sin(lat) - N * (1 - el.e2);
        return { lat: this.toDeg(lat), lng: this.toDeg(lng), h };
      }

      static geoToUTM(latDeg, lngDeg, huso, el) {
        const a = el.a, e2 = el.e2, ep2 = el.ep2, k0 = 0.9996, lon0 = huso * 6 - 183;
        const latR = this.toRad(latDeg), lngR = this.toRad(lngDeg), lng0R = this.toRad(lon0);
        const N = this._N(latR, el), T = Math.tan(latR) ** 2, C = ep2 * Math.cos(latR) ** 2, A = Math.cos(latR) * (lngR - lng0R);
        const e4 = e2 * e2, e6 = e4 * e2;
        const M = a * ((1 - e2 / 4 - (3 * e4) / 64 - (5 * e6) / 256) * latR - ((3 * e2) / 8 + (3 * e4) / 32 + (45 * e6) / 1024) * Math.sin(2 * latR) + ((15 * e4) / 256 + (45 * e6) / 1024) * Math.sin(4 * latR) - ((35 * e6) / 3072) * Math.sin(6 * latR));
        const A2 = A * A, A3 = A2 * A, A4 = A3 * A, A5 = A4 * A, A6 = A5 * A;
        const este = k0 * N * (A + ((1 - T + C) * A3) / 6 + ((5 - 18 * T + T * T + 72 * C - 58 * ep2) * A5) / 120) + 500000.0;
        let norte = k0 * (M + N * Math.tan(latR) * (A2 / 2 + ((5 - T + 9 * C + 4 * C * C) * A4) / 24 + ((61 - 58 * T + T * T + 600 * C - 330 * ep2) * A6) / 720));
        if (latDeg < 0) norte += 10000000.0;
        return { este: Math.round(este * 1000) / 1000, norte: Math.round(norte * 1000) / 1000, huso };
      }

      static utmToGeo(este, norte, huso, hemiSur, el) {
        const k0 = 0.9996, a = el.a, e2 = el.e2, ep2 = el.ep2;
        const e1 = (1 - Math.sqrt(1 - e2)) / (1 + Math.sqrt(1 - e2)), lon0 = this.toRad(huso * 6 - 183);
        const x = este - 500000.0;
        let y = norte;
        if (hemiSur) y -= 10000000.0;
        const e4 = e2 * e2, e6 = e4 * e2;
        const mu = (y / k0) / (a * (1 - e2 / 4 - (3 * e4) / 64 - (5 * e6) / 256));
        const e12 = e1 * e1, e13 = e12 * e1, e14 = e13 * e1;
        const phi1 = mu + ((3 * e1) / 2 - (27 * e13) / 32) * Math.sin(2 * mu) + ((21 * e12) / 16 - (55 * e14) / 32) * Math.sin(4 * mu) + ((151 * e13) / 96) * Math.sin(6 * mu) + ((1097 * e14) / 512) * Math.sin(8 * mu);
        const N1 = this._N(phi1, el), T1 = Math.tan(phi1) ** 2, C1 = ep2 * Math.cos(phi1) ** 2;
        const R1 = (a * (1 - e2)) / Math.pow(1 - e2 * Math.sin(phi1) ** 2, 1.5), D = x / (N1 * k0);
        const D2 = D * D, D3 = D2 * D, D4 = D3 * D, D5 = D4 * D, D6 = D5 * D;
        const lat = phi1 - ((N1 * Math.tan(phi1)) / R1) * (D2 / 2 - ((5 + 3 * T1 + 10 * C1 - 4 * C1 * C1 - 9 * ep2) * D4) / 24 + ((61 + 90 * T1 + 298 * C1 + 45 * T1 * T1 - 252 * ep2 - 3 * C1 * C1) * D6) / 720);
        const lng = lon0 + (1 / Math.cos(phi1)) * (D - ((1 + 2 * T1 + C1) * D3) / 6 + ((5 - 2 * C1 + 28 * T1 - 3 * C1 * C1 + 8 * ep2 + 24 * T1 * T1) * D5) / 120);
        return { lat: this.toDeg(lat), lng: this.toDeg(lng) };
      }

      static badekas(X, Y, Z, inverso) {
        const p = PATVEN98;
        const rxR = this.toRad(p.rx / 3600), ryR = this.toRad(p.ry / 3600), rzR = this.toRad(p.rz / 3600), s = 1 + p.ds * 1e-6;
        if (!inverso) {
          const dX = X - p.XM, dY = Y - p.YM, dZ = Z - p.ZM;
          return { X: s * (dX + rzR * dY - ryR * dZ) + p.XM + p.dx, Y: s * (-rzR * dX + dY + rxR * dZ) + p.YM + p.dy, Z: s * (ryR * dX - rxR * dY + dZ) + p.ZM + p.dz };
        }
        const dX = X - p.XM - p.dx, dY = Y - p.YM - p.dy, dZ = Z - p.ZM - p.dz, sI = 1 / s;
        return { X: sI * (dX - rzR * dY + ryR * dZ) + p.XM, Y: sI * (rzR * dX + dY - rxR * dZ) + p.YM, Z: sI * (-ryR * dX + rxR * dY + dZ) + p.ZM };
      }

      static transformRigida02(vertices, customDeltas = {}, inv = false) {
        const rawDe = Number.isFinite(customDeltas.deltaEste) ? customDeltas.deltaEste : this.RIGIDA02_DELTA_ESTE;
        const rawDn = Number.isFinite(customDeltas.deltaNorte) ? customDeltas.deltaNorte : this.RIGIDA02_DELTA_NORTE;
        const cotaGeoidal = Number.isFinite(customDeltas.cotaGeoidal) ? customDeltas.cotaGeoidal : this.RIGIDA02_COTA_GEOIDAL;
        const huso = customDeltas.huso || 19;
        const deltaEste = inv ? -rawDe : rawDe;
        const deltaNorte = inv ? -rawDn : rawDn;
        const elD = inv ? HAYFORD : GRS80;
        const resultados = vertices.map((v, idx) => {
          let n = Number(v.norte), e = Number(v.este);
          if (e > n) [n, e] = [e, n];
          const esteDest = Math.round((e + deltaEste) * 1000) / 1000;
          const norteDest = Math.round((n + deltaNorte) * 1000) / 1000;
          const cotaDest = Math.round(((Number(v.z || 0) === 0) ? cotaGeoidal : Number(v.z)) * 1000) / 1000;
          const geoD = this.utmToGeo(esteDest, norteDest, huso, false, elD);
          return { id: v.id || `P${idx + 1}`, este: esteDest, norte: norteDest, cota: cotaDest, lat: geoD.lat, lng: geoD.lng };
        });
        return { resultados, qaqcPasado: true };
      }

      static formatDMS(degDecimal, isLat = true) {
        const abs = Math.abs(degDecimal), d = Math.floor(abs), mf = (abs - d) * 60, m = Math.floor(mf), s = ((mf - m) * 60).toFixed(3);
        const h = isLat ? (degDecimal >= 0 ? 'N' : 'S') : degDecimal >= 0 ? 'E' : 'W';
        return `${String(d).padStart(2, '0')}°${String(m).padStart(2, '0')}'${String(s).padStart(6, '0')}"${h}`;
      }

      static formatRumbo(dE, dN) {
        let az = (Math.atan2(dE, dN) * 180) / Math.PI;
        if (az < 0) az += 360;
        let ns = 'N', ew = 'E', rDeg = az;
        if (az <= 90) { ns = 'N'; ew = 'E'; rDeg = az; }
        else if (az <= 180) { ns = 'S'; ew = 'E'; rDeg = 180 - az; }
        else if (az <= 270) { ns = 'S'; ew = 'W'; rDeg = az - 180; }
        else { ns = 'N'; ew = 'W'; rDeg = 360 - az; }
        const d = Math.floor(rDeg), mf = (rDeg - d) * 60, m = Math.floor(mf), s = Math.round((mf - m) * 60);
        return { azimutDeg: az, rumbo: `${ns} ${String(d).padStart(2, '0')}°${String(m).padStart(2, '0')}'${String(s).padStart(2, '0')}" ${ew}` };
      }

      static calculatePolygonStats(verts) {
        if (!verts || verts.length < 2) return { areaM2: 0, areaHa: 0, perimeter: 0, legs: [] };
        let area = 0, perimeter = 0;
        const legs = [];
        for (let i = 0; i < verts.length; i++) {
          const p1 = verts[i], p2 = verts[(i + 1) % verts.length];
          area += p1.este * p2.norte - p2.este * p1.norte;
          const dE = p2.este - p1.este, dN = p2.norte - p1.norte, dist = Math.hypot(dE, dN);
          perimeter += dist;
          legs.push({ from: p1.id, to: p2.id, distancia: dist, ...this.formatRumbo(dE, dN) });
        }
        const areaM2 = Math.abs(area) / 2;
        return { areaM2, areaHa: areaM2 / 10000, perimeter, legs };
      }

      static generateCivilCAD(verts, parcel) {
        return verts.map((v) => `${v.id},${v.este.toFixed(3)},${v.norte.toFixed(3)},${v.z.toFixed(3)},${parcel}`).join('\n');
      }

      static generateDXF(verts) {
        const lines = ['0', 'SECTION', '2', 'HEADER', '9', '$ACADVER', '1', 'AC1009', '0', 'ENDSEC', '0', 'SECTION', '2', 'ENTITIES'];
        if (verts.length >= 2) {
          lines.push('0', 'POLYLINE', '8', 'LINDEROS', '66', '1', '70', verts.length >= 3 ? '1' : '0');
          for (const v of verts) lines.push('0', 'VERTEX', '8', 'LINDEROS', '10', v.este.toFixed(3), '20', v.norte.toFixed(3), '30', v.z.toFixed(3));
          lines.push('0', 'SEQEND');
        }
        lines.push('0', 'ENDSEC', '0', 'EOF');
        return lines.join('\n');
      }

      static generateKML(verts, parcel) {
        const ring = verts.map((v) => `${v.lng.toFixed(8)},${v.lat.toFixed(8)},${v.z.toFixed(2)}`);
        if (verts.length >= 3) ring.push(`${verts[0].lng.toFixed(8)},${verts[0].lat.toFixed(8)},${verts[0].z.toFixed(2)}`);
        return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${parcel}</name><Placemark><name>${parcel}</name><Polygon><outerBoundaryIs><LinearRing><coordinates>${ring.join(' ')}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark></Document></kml>`;
      }
    }

    function computeDualUtm(lat, lng, z) {
      const regven = GeoEngine.geoToUTM(lat, lng, state.huso, GRS80);
      let canoaEste = regven.este, canoaNorte = regven.norte;
      if (state.method === 'rigida02') {
        canoaEste = Math.round((regven.este - GeoEngine.RIGIDA02_DELTA_ESTE) * 1000) / 1000;
        canoaNorte = Math.round((regven.norte - GeoEngine.RIGIDA02_DELTA_NORTE) * 1000) / 1000;
      } else {
        const cartR = GeoEngine.geoToCart(lat, lng, z, GRS80);
        const cartC = GeoEngine.badekas(cartR.X, cartR.Y, cartR.Z, true);
        const geoC = GeoEngine.cartToGeo(cartC.X, cartC.Y, cartC.Z, HAYFORD);
        const utmC = GeoEngine.geoToUTM(geoC.lat, geoC.lng, state.huso, HAYFORD);
        canoaEste = utmC.este;
        canoaNorte = utmC.norte;
      }
      const lon0 = state.huso * 6 - 183, latR = GeoEngine.toRad(lat), sLat = Math.sin(latR);
      const N = GRS80.a / Math.sqrt(1 - GRS80.e2 * sLat * sLat);
      const rho = (GRS80.a * (1 - GRS80.e2)) / Math.pow(1 - GRS80.e2 * sLat * sLat, 1.5);
      const rMean = Math.sqrt(N * rho), x = regven.este - 500000;
      const k = 0.9996 * (1 + (x * x) / (2 * rMean * rMean * 0.9996 * 0.9996));
      const conv = (lng - lon0) * sLat;
      return { regvenEste: regven.este, regvenNorte: regven.norte, canoaEste, canoaNorte, k, conv };
    }

    function getComputedParcel() {
      const mapped = state.vertices.map((v) => {
        const dual = computeDualUtm(v.lat, v.lng, v.z);
        const este = state.direction === 'canoa_regven' ? dual.regvenEste : dual.canoaEste;
        const norte = state.direction === 'canoa_regven' ? dual.regvenNorte : dual.canoaNorte;
        return { ...v, ...dual, este, norte };
      });
      const stats = GeoEngine.calculatePolygonStats(mapped);
      const enriched = mapped.map((v, i) => ({
        ...v,
        rumbo: stats.legs[i]?.rumbo || '—',
        dist: stats.legs[i]?.distancia || 0,
      }));
      const target = enriched.find((v) => v.id === state.stakeTargetId) || enriched[0];
      const roverUtm = computeDualUtm(state.gnss.lat, state.gnss.lng, state.gnss.alt);
      const roverE = state.direction === 'canoa_regven' ? roverUtm.regvenEste : roverUtm.canoaEste;
      const roverN = state.direction === 'canoa_regven' ? roverUtm.regvenNorte : roverUtm.canoaNorte;
      const dE = (target?.este ?? roverE) - roverE;
      const dN = (target?.norte ?? roverN) - roverN;
      const dZ = (target?.z ?? state.gnss.alt) - state.gnss.alt;
      const distH = Math.hypot(dE, dN);
      const { rumbo, azimutDeg } = GeoEngine.formatRumbo(dE, dN);
      const relAngle = state.compassHeading !== null ? (azimutDeg - state.compassHeading + 360) % 360 : azimutDeg;
      return {
        enriched,
        stats,
        target,
        roverUtm,
        roverE,
        roverN,
        stakeout: { dE, dN, dZ, distH, rumbo, azimutDeg, relAngle, inTolerance: distH <= 0.5 },
      };
    }

    // ======================== ACTIONS ========================
    function captureGpsVertex() {
      const id = `V-${String(state.vertices.length + 1).padStart(2, '0')}`;
      let lat = state.gnss.lat, lng = state.gnss.lng, z = state.gnss.alt;
      if (state.averagingSamples.length > 0) {
        const n = state.averagingSamples.length;
        lat = state.averagingSamples.reduce((a, s) => a + s.lat, 0) / n;
        lng = state.averagingSamples.reduce((a, s) => a + s.lng, 0) / n;
        z = state.averagingSamples.reduce((a, s) => a + s.alt, 0) / n;
      }
      state.vertices.push({ id, lat, lng, z: Math.round(z * 1000) / 1000, rms: state.gnss.accuracy });
      state.stakeTargetId = id;
      state.averagingActive = false;
      state.averagingSamples = [];
      notify(`Vértice ${id} grabado (±${state.gnss.accuracy.toFixed(1)}m)`);
      renderAll();
    }

    function runLocate() {
      if (state.locateMode === 'utm') {
        const e = parseFloat(state.locateEste), n = parseFloat(state.locateNorte), z = parseFloat(state.locateZ) || 0;
        if (!Number.isFinite(e) || !Number.isFinite(n)) return notify('Coordenadas Este/Norte inválidas');
        let geo = GeoEngine.utmToGeo(e, n, state.locateHuso, false, GRS80);
        if (state.locateDatum === 'canoa') {
          const r = GeoEngine.transformRigida02([{ id: 'LOC', este: e, norte: n, z }], { huso: state.locateHuso }).resultados[0];
          geo = { lat: r.lat, lng: r.lng };
        }
        const id = `L-${String(state.vertices.length + 1).padStart(2, '0')}`;
        state.huso = state.locateHuso;
        state.vertices.push({ id, lat: geo.lat, lng: geo.lng, z, rms: 0.005 });
        state.stakeTargetId = id;
        state.activeTab = 'map';
        renderAll();
        if (leafletMap) leafletMap.setView([geo.lat, geo.lng], 19);
        notify(`Punto ${id} localizado y replanteo activo`);
      } else if (state.locateMode === 'geo') {
        const lat = parseFloat(state.locateLat), lng = parseFloat(state.locateLng), z = parseFloat(state.locateZ) || 0;
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return notify('Lat/Lng inválidas');
        const id = `L-${String(state.vertices.length + 1).padStart(2, '0')}`;
        state.huso = GeoEngine.detectHuso(lng);
        state.vertices.push({ id, lat, lng, z, rms: 0.005 });
        state.stakeTargetId = id;
        state.activeTab = 'map';
        renderAll();
        if (leafletMap) leafletMap.setView([lat, lng], 19);
        notify(`Coordenada ${id} localizada`);
      } else {
        const lines = state.locateBatch.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        const verts = [];
        lines.forEach((line, idx) => {
          const parts = line.split(/[,\t;\s]+/).filter(Boolean);
          if (parts.length < 2) return;
          const hasLabel = Number.isNaN(Number(parts[0]));
          const id = hasLabel ? parts[0] : `P-${String(idx + 1).padStart(2, '0')}`;
          const e = Number(hasLabel ? parts[1] : parts[0]), n = Number(hasLabel ? parts[2] : parts[1]), z = Number(hasLabel ? parts[3] : parts[2]) || 0;
          if (!Number.isFinite(e) || !Number.isFinite(n)) return;
          let geo = GeoEngine.utmToGeo(e, n, state.locateHuso, false, GRS80);
          if (state.locateDatum === 'canoa') {
            const r = GeoEngine.transformRigida02([{ id, este: e, norte: n, z }], { huso: state.locateHuso }).resultados[0];
            geo = { lat: r.lat, lng: r.lng };
          }
          verts.push({ id, lat: geo.lat, lng: geo.lng, z, rms: 0.005 });
        });
        if (verts.length < 2) return notify('Pega al menos 2 vértices válidos');
        state.parcelName = 'PARCELA_LOCALIZADA';
        state.huso = state.locateHuso;
        state.vertices = verts;
        state.stakeTargetId = verts[0].id;
        state.activeTab = 'map';
        renderAll();
        if (leafletMap) leafletMap.fitBounds(verts.map((v) => [v.lat, v.lng]), { padding: [36, 36] });
        notify(`Parcela trazada con ${verts.length} vértices`);
      }
    }

    function startGpsWatch() {
      if (!navigator.geolocation || !state.gpsEnabled) {
        state.gpsStatus = 'Sin hardware GNSS disponible';
        return;
      }
      if (state.gpsWatchId) navigator.geolocation.clearWatch(state.gpsWatchId);
      state.gpsWatchId = navigator.geolocation.watchPosition(
        (pos) => {
          const c = pos.coords;
          state.gnss = { lat: c.latitude, lng: c.longitude, alt: c.altitude ?? 0, accuracy: c.accuracy || 5, isLive: true };
          state.huso = GeoEngine.detectHuso(c.longitude);
          state.gpsStatus = `GNSS Activo (±${state.gnss.accuracy.toFixed(1)} m)`;
          if (state.averagingActive && state.averagingSamples.length < 10) {
            const utm = computeDualUtm(c.latitude, c.longitude, c.altitude ?? 0);
            state.averagingSamples.push({ lat: c.latitude, lng: c.longitude, alt: c.altitude ?? 0, este: utm.regvenEste, norte: utm.regvenNorte });
            if (state.averagingSamples.length >= 10) state.averagingActive = false;
          }
          renderAll();
        },
        (err) => { state.gpsStatus = `GNSS en espera (${err.message})`; renderAll(); },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    }

    async function probeCloud() {
      try {
        const res = await fetch(`${CLOUD_URL}/api/health`, { cache: 'no-store' });
        const d = await res.json().catch(() => null);
        state.cloudStatus = d && d.database === 'connected' ? 'PostgreSQL Conectado' : 'En línea';
      } catch {
        state.cloudStatus = 'Offline (Modo Campo)';
      }
      if (state.activeTab === 'export') renderAll();
    }

    // Bind static buttons
    document.querySelectorAll('.nav-btn').forEach((b) => b.addEventListener('click', () => { state.activeTab = b.getAttribute('data-tab'); renderAll(); if (state.activeTab === 'map' && leafletMap) setTimeout(() => leafletMap.invalidateSize(), 120); }));
    document.getElementById('btn-toggle-dir').addEventListener('click', () => { state.direction = state.direction === 'canoa_regven' ? 'regven_canoa' : 'canoa_regven'; renderAll(); });
    document.getElementById('btn-toggle-map-engine').addEventListener('click', () => {
      state.mapEngine = state.mapEngine === 'leaflet' ? 'svg' : 'leaflet';
      renderAll();
      if (state.mapEngine === 'leaflet' && leafletMap) setTimeout(() => leafletMap.invalidateSize(), 150);
    });
    function cycleLayer() {
      state.layerMode = LAYER_ORDER[(LAYER_ORDER.indexOf(state.layerMode) + 1) % LAYER_ORDER.length];
      if (leafletTileLayer) leafletTileLayer.setUrl(getTileUrl(state.layerMode));
      notify(`Capa: ${LAYER_TEXT[state.layerMode]}`);
      renderAll();
    }
    document.getElementById('btn-cycle-layer').addEventListener('click', cycleLayer);
    document.getElementById('fab-layers').addEventListener('click', cycleLayer);
    document.getElementById('fab-capture').addEventListener('click', captureGpsVertex);
    document.getElementById('fab-center-gps').addEventListener('click', () => {
      state.gpsEnabled = true;
      startGpsWatch();
      if (leafletMap) leafletMap.setView([state.gnss.lat, state.gnss.lng], 19);
      notify('Centrado en GPS en tiempo real');
    });
    document.getElementById('fab-goto-locate').addEventListener('click', () => { state.activeTab = 'locate'; renderAll(); });
    document.getElementById('fab-goto-topo').addEventListener('click', () => { state.activeTab = 'topographer'; renderAll(); });
    document.getElementById('map-stake-pill').addEventListener('click', () => { state.activeTab = 'locate'; renderAll(); });
    document.getElementById('btn-cloud-sync').addEventListener('click', () => { probeCloud().then(() => notify(`Nube: ${state.cloudStatus}`)); });

    window.addEventListener('deviceorientation', (ev) => {
      const h = ev.webkitCompassHeading ?? (typeof ev.alpha === 'number' ? (360 - ev.alpha) % 360 : null);
      if (h !== null && !Number.isNaN(h)) state.compassHeading = Math.round(h * 10) / 10;
    });

    startGpsWatch();
    probeCloud();
    renderAll();
  </script>
</body>
</html>
